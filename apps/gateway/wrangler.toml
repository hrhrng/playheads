name = "playheads-gateway"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[services]]
binding = "WEB"
service = "playheads-web"

[[services]]
binding = "LANDING"
service = "playheads-landing"

[[services]]
binding = "ADMIN"
service = "playheads-admin"

[[services]]
binding = "AGENT"
service = "playheads-agent"

[[services]]
binding = "BILLING"
service = "playheads-billing"

[[d1_databases]]
binding = "DB"
database_name = "playheads-db"
database_id = "31cba35f-8e23-46eb-880f-19d667c0946b"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "playheads-uploads"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "1d947fda21c9442aaa6c3877b0b32a0e"

# Workers AI binding — serves the cf-workers-ai ASR provider in
# /api/transcribe (whisper-large-v3-turbo) without an external key.
[ai]
binding = "AI"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[vars]
APP_HOSTNAME = ""
ADMIN_HOSTNAME = ""
UPLOADS_PUBLIC_URL_BASE = "https://pub-943b20bdbf6f4e9fbc62c596787afcb2.r2.dev"
# AI Gateway config — mirrors agent worker so /api/transcribe can route
# ElevenLabs (and any future ASR/TTS providers) through the same "clash"
# gateway used for LLM observability.
CLOUDFLARE_ACCOUNT_ID = "44af79e51582ca20c9003eb926540242"
AI_GATEWAY_ID = "clash"
# Secrets — set via GitHub Actions deploy workflows:
#   ADMIN_ENCRYPTION_KEY — decrypts asr_provider_config API keys (same key
#                          as playheads-admin / playheads-agent)
#   CF_AIG_TOKEN         — auth for AI Gateway-proxied ASR providers

