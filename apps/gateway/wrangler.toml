name = "playheads-gateway"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[services]]
binding = "WEB"
service = "playheads-web"

[[services]]
binding = "LANDING"
service = "playheads-landing"

[[services]]
binding = "BACKEND"
service = "playheads-backend"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[vars]
APP_HOSTNAME = ""
