name = "playheads-gateway"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[services]]
binding = "WEB"
service = "playheads-web"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BackendContainer"]

[[migrations]]
tag = "v2"
deleted_classes = ["BackendContainer"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
