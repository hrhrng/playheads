name = "playheads-agent"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MusicChatAgent"
class_name = "MusicChatAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MusicChatAgent"]

[[d1_databases]]
binding = "DB"
database_name = "playheads-db"
database_id = "31cba35f-8e23-46eb-880f-19d667c0946b"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[vars]
# LLM provider: "anthropic" (default) or "doubao"
LLM_PROVIDER = "anthropic"

# Anthropic settings (used when LLM_PROVIDER=anthropic)
ANTHROPIC_MODEL = "claude-sonnet-4-6"
ANTHROPIC_THINKING_BUDGET = "0"

# Doubao (ByteDance Volcano Engine Ark) settings (used when LLM_PROVIDER=doubao)
# Secret: set via `wrangler secret put DOUBAO_API_KEY`
DOUBAO_MODEL = "doubao-1.5-pro-32k"

APPLE_MUSIC_TOKEN_TTL_SECONDS = "3600"
CLOUDFLARE_ACCOUNT_ID = "44af79e51582ca20c9003eb926540242"
AI_GATEWAY_ID = "clash"

# Secrets (set via `wrangler secret put <NAME>`)
# ADMIN_ENCRYPTION_KEY  — same 64-char hex as playheads-admin; used to decrypt DB keys at runtime
# TAVILY_API_KEY        — Tavily search API key (https://tavily.com); used for web_search on non-Anthropic providers
# CF_AIG_TOKEN          — Cloudflare AI Gateway token (Anthropic env-based fallback)
# DOUBAO_API_KEY        — Doubao API key (env-based fallback when no DB config)
# APPLE_MUSIC_TEAM_ID, APPLE_MUSIC_KEY_ID, APPLE_MUSIC_PRIVATE_KEY
