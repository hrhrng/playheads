name = "playheads-agent"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MusicChatAgent"
class_name = "MusicChatAgent"

[[durable_objects.bindings]]
name = "VoiceDJAgent"
class_name = "VoiceDJAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MusicChatAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["VoiceDJAgent"]

[[d1_databases]]
binding = "DB"
database_name = "playheads-db"
database_id = "31cba35f-8e23-46eb-880f-19d667c0946b"

# Workers AI — powers @cloudflare/voice STT (Deepgram Flux) + TTS (Aura).
[ai]
binding = "AI"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[vars]
# LLM provider fallback (used when no DB caller binding exists): "anthropic" | "doubao" | etc.
LLM_PROVIDER = "anthropic"

# Anthropic model fallback (used when no DB config)
ANTHROPIC_MODEL = "claude-sonnet-4-6"
# Note: ANTHROPIC_THINKING_BUDGET removed — thinking is now controlled by
# the thinkingEnabled flag in llm_provider_config (set via admin panel).

# Doubao model fallback (used when LLM_PROVIDER=doubao and no DB config)
# Secret: set via `wrangler secret put DOUBAO_API_KEY`
DOUBAO_MODEL = "doubao-1.5-pro-32k"

APPLE_MUSIC_TOKEN_TTL_SECONDS = "3600"
CLOUDFLARE_ACCOUNT_ID = "44af79e51582ca20c9003eb926540242"
AI_GATEWAY_ID = "clash"

# Search provider: "anthropic" (native, Anthropic LLM only) | "brave" | "tavily" | "none"
# Switch to "brave" or "tavily" to use external search APIs with any LLM provider.
SEARCH_PROVIDER = "anthropic"

# ElevenLabs TTS — routed through AI Gateway with unified billing.
# No ElevenLabs API key needed; CF_AIG_TOKEN is the cf-aig-authorization Bearer
# and Cloudflare fronts the ElevenLabs bill (or injects your BYOK from the
# Secrets Store — both use the same header).
# Enable ElevenLabs + Unified Billing in the AI Gateway dashboard first.
# Voice library: https://elevenlabs.io/voice-library
ELEVENLABS_VOICE_ID = "21m00Tcm4TlvDq8ikWAM"
# Models: eleven_multilingual_v2 (best CJK), eleven_turbo_v2_5, eleven_flash_v2_5 (fastest)
ELEVENLABS_MODEL = "eleven_multilingual_v2"

# Secrets (set via `wrangler secret put <NAME>`)
# ADMIN_ENCRYPTION_KEY   — same 64-char hex as playheads-admin; used to decrypt DB keys at runtime
# TAVILY_API_KEY         — Tavily search API key (https://tavily.com); used when SEARCH_PROVIDER=tavily
# BRAVE_SEARCH_API_KEY   — Brave Search API key (https://brave.com/search/api); used when SEARCH_PROVIDER=brave
# CF_AIG_TOKEN           — Cloudflare AI Gateway token (also drives ElevenLabs unified billing)
# DOUBAO_API_KEY         — Doubao API key (env-based fallback when no DB config)
# APPLE_MUSIC_TEAM_ID, APPLE_MUSIC_KEY_ID, APPLE_MUSIC_PRIVATE_KEY
