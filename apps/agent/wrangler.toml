name = "playheads-agent"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MusicChatAgent"
class_name = "MusicChatAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MusicChatAgent"]

[[d1_databases]]
binding = "DB"
database_name = "playheads-db"
database_id = "31cba35f-8e23-46eb-880f-19d667c0946b"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[vars]
# LLM provider: "anthropic" (default) or "doubao"
LLM_PROVIDER = "anthropic"

# Anthropic settings (used when LLM_PROVIDER=anthropic)
ANTHROPIC_MODEL = "claude-sonnet-4-6"
ANTHROPIC_THINKING_BUDGET = "0"

# Doubao (ByteDance Volcano Engine Ark) settings (used when LLM_PROVIDER=doubao)
# Secrets (set via `wrangler secret put`): DOUBAO_API_KEY, DOUBAO_BOT_ID
DOUBAO_MODEL = "doubao-1.5-pro-32k"
# Optional: Bot ID for platform-native web search (联网内容插件).
# When set, the /bots endpoint is called and web search is handled automatically.
DOUBAO_BOT_ID = ""

APPLE_MUSIC_TOKEN_TTL_SECONDS = "3600"
CLOUDFLARE_ACCOUNT_ID = "44af79e51582ca20c9003eb926540242"
AI_GATEWAY_ID = "clash"
