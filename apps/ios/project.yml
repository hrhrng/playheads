name: MusicAgent
options:
  bundleIdPrefix: ai.playheads
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "962863MJ5J"
    CODE_SIGN_STYLE: Automatic
    # React Native is hoisted to the pnpm monorepo root (.npmrc:
    # node-linker=hoisted). RN's build-phase scripts key off REACT_NATIVE_PATH
    # to locate `with-environment.sh` and the Hermes / codegen helpers —
    # thread it in here so every target inherits.
    REACT_NATIVE_PATH: $(SRCROOT)/../../node_modules/react-native
targets:
  MusicAgent:
    type: application
    platform: iOS
    sources:
      - MusicAgent
    entitlements:
      path: MusicAgent/MusicAgent.entitlements
      properties:
        com.apple.developer.musickit: true
        com.apple.developer.applesignin: [Default]
    info:
      path: MusicAgent/Info.plist
      properties:
        CFBundleDisplayName: Playheads
        CFBundleDevelopmentRegion: en
        # Ship both localizations — Xcode compiles Localizable.xcstrings into
        # per-locale .strings, and this list is what the App Store / system
        # language picker use to decide which to serve.
        CFBundleLocalizations:
          - en
          - zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppleMusicUsageDescription: Playheads uses Apple Music to play and explore songs in your mood feed.
        # Custom display face — see Typography.swift. Registering here tells
        # CoreText to load the TTF on launch so SwiftUI's Font.custom() call
        # resolves without runtime registration ceremony.
        UIAppFonts:
          - LXGWWenKaiScreen.ttf
        # Allow Metro bundler on localhost during development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # CocoaPods xcconfig (generated by `pod install`) must be the base config
    # for each build configuration so Pods-linked frameworks, header search
    # paths, and $(inherited) flags propagate to this target.
    configFiles:
      Debug: Pods/Target Support Files/Pods-MusicAgent/Pods-MusicAgent.debug.xcconfig
      Release: Pods/Target Support Files/Pods-MusicAgent/Pods-MusicAgent.release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.playheads.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # Swift ↔ ObjC bridge for React Native factory / delegate headers.
        SWIFT_OBJC_BRIDGING_HEADER: MusicAgent/MusicAgent-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
        # The ReactAppDependencyProvider modulemap lives under its per-target
        # build dir; Swift's module resolver needs it surfaced explicitly.
        SWIFT_INCLUDE_PATHS: $(inherited) $(PODS_CONFIGURATION_BUILD_DIR)/ReactAppDependencyProvider
        # RN's ReactCodegen static lib contains C++ symbols (__gxx_personality_v0).
        # The host app is pure Swift + ObjC, so libc++ isn't auto-linked; add it.
        OTHER_LDFLAGS: $(inherited) -lc++
        CLANG_CXX_LIBRARY: libc++
    # CocoaPods script phases: run `[CP] Check Pods Manifest.lock` before build
    # (fails fast if pods fell out of sync) and copy frameworks/resources after.
    preBuildScripts:
      - name: "[CP] Check Pods Manifest.lock"
        script: |
          diff "${PODS_PODFILE_DIR_PATH}/Podfile.lock" "${PODS_ROOT}/Manifest.lock" > /dev/null
          if [ $? != 0 ] ; then
              cat << EOM
          error: The sandbox is not in sync with the Podfile.lock. Run 'pod install' or update your CocoaPods installation.
          EOM
              exit 1
          fi
          echo "SUCCESS" > "${SCRIPT_OUTPUT_FILE_0}"
        inputFiles:
          - ${PODS_PODFILE_DIR_PATH}/Podfile.lock
          - ${PODS_ROOT}/Manifest.lock
        outputFiles:
          - $(DERIVED_FILE_DIR)/Pods-MusicAgent-checkManifestLockResult.txt
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: "[CP] Copy Pods Resources"
        script: |
          "${PODS_ROOT}/Target Support Files/Pods-MusicAgent/Pods-MusicAgent-resources.sh"
        inputFileLists:
          - ${PODS_ROOT}/Target Support Files/Pods-MusicAgent/Pods-MusicAgent-resources-${CONFIGURATION}-input-files.xcfilelist
        outputFileLists:
          - ${PODS_ROOT}/Target Support Files/Pods-MusicAgent/Pods-MusicAgent-resources-${CONFIGURATION}-output-files.xcfilelist
      - name: "[CP] Embed Pods Frameworks"
        script: |
          "${PODS_ROOT}/Target Support Files/Pods-MusicAgent/Pods-MusicAgent-frameworks.sh"
        inputFileLists:
          - ${PODS_ROOT}/Target Support Files/Pods-MusicAgent/Pods-MusicAgent-frameworks-${CONFIGURATION}-input-files.xcfilelist
        outputFileLists:
          - ${PODS_ROOT}/Target Support Files/Pods-MusicAgent/Pods-MusicAgent-frameworks-${CONFIGURATION}-output-files.xcfilelist
