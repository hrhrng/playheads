name: MusicAgent
options:
  bundleIdPrefix: ai.playheads
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "962863MJ5J"
    CODE_SIGN_STYLE: Automatic
targets:
  MusicAgent:
    type: application
    platform: iOS
    sources:
      - MusicAgent
    entitlements:
      path: MusicAgent/MusicAgent.entitlements
      properties:
        com.apple.developer.musickit: true
    info:
      path: MusicAgent/Info.plist
      properties:
        CFBundleDisplayName: Playheads
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppleMusicUsageDescription: Playheads uses Apple Music to play and explore songs in your mood feed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.playheads.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
