name = "playheads-billing"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "playheads-db"
database_id = "31cba35f-8e23-46eb-880f-19d667c0946b"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[vars]
POLAR_API_BASE = "https://sandbox-api.polar.sh"
POLAR_ORG_ID = ""
POLAR_PRODUCT_PLUS_ID = ""
POLAR_PRODUCT_PRO_ID = ""
APP_ORIGIN = ""
