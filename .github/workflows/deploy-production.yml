name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_SPOTIFY_REDIRECT_URI: https://app.${{ vars.PRODUCTION_DOMAIN }}/callback
        run: pnpm --filter web build

      - name: Build landing
        env:
          PUBLIC_APP_URL: https://app.${{ vars.PRODUCTION_DOMAIN }}
        run: pnpm --filter landing build

      - name: Deploy landing worker
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.toml

      - name: Deploy admin worker
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync admin secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER="playheads-admin"
          if [ -n "${{ secrets.RESEND_API_KEY }}" ]; then
            printf '%s' "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY --name "$WORKER" && echo "✓ RESEND_API_KEY" || echo "✗ RESEND_API_KEY failed"
          fi
          if [ -n "${{ secrets.ADMIN_ENCRYPTION_KEY }}" ]; then
            printf '%s' "${{ secrets.ADMIN_ENCRYPTION_KEY }}" | npx wrangler secret put ADMIN_ENCRYPTION_KEY --name "$WORKER" && echo "✓ ADMIN_ENCRYPTION_KEY" || echo "✗ ADMIN_ENCRYPTION_KEY failed"
          fi

      - name: Deploy web worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy agent worker
        working-directory: apps/agent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy gateway worker
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config wrangler.production.toml \
            --route "app.${{ vars.PRODUCTION_DOMAIN }}/*" \
            --route "${{ vars.PRODUCTION_DOMAIN }}/*" \
            --route "admin.${{ vars.PRODUCTION_DOMAIN }}/*" \
            --var APP_HOSTNAME:app.${{ vars.PRODUCTION_DOMAIN }} \
            --var ADMIN_HOSTNAME:admin.${{ vars.PRODUCTION_DOMAIN }}

      - name: Sync gateway secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER="playheads-gateway"
          DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
          declare -A SECRETS=(
            [BETTER_AUTH_SECRET]="${{ secrets.BETTER_AUTH_SECRET }}"
            [BETTER_AUTH_URL]="https://${DOMAIN}"
            [BETTER_AUTH_TRUSTED_ORIGINS]="https://${DOMAIN},https://app.${DOMAIN},https://preview.${DOMAIN},https://preview.app.${DOMAIN}"
            [APPLE_CLIENT_ID]="${{ secrets.APPLE_CLIENT_ID }}"
            [APPLE_KEY_ID]="${{ secrets.APPLE_KEY_ID }}"
            [APPLE_TEAM_ID]="${{ secrets.APPLE_TEAM_ID }}"
            [APPLE_PRIVATE_KEY]="${{ secrets.APPLE_PRIVATE_KEY }}"
            [GOOGLE_CLIENT_ID]="${{ secrets.GOOGLE_CLIENT_ID }}"
            [GOOGLE_CLIENT_SECRET]="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            [RESEND_API_KEY]="${{ secrets.RESEND_API_KEY }}"
          )
          FAILED=0
          for KEY in "${!SECRETS[@]}"; do
            VAL="${SECRETS[$KEY]}"
            if [ -n "$VAL" ]; then
              if printf '%s' "$VAL" | npx wrangler secret put "$KEY" --name "$WORKER"; then
                echo "✓ $KEY"
              else
                echo "✗ $KEY failed"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi

      - name: Sync agent worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER="playheads-agent"
          # CLOUDFLARE_ACCOUNT_ID and AI_GATEWAY_ID are already defined as
          # [vars] in wrangler.toml — do NOT set them as secrets (name conflict).
          declare -A SECRETS=(
            [CF_AIG_TOKEN]="${{ secrets.CF_AIG_TOKEN }}"
            [APPLE_MUSIC_TEAM_ID]="${{ secrets.APPLE_MUSIC_TEAM_ID }}"
            [APPLE_MUSIC_KEY_ID]="${{ secrets.APPLE_MUSIC_KEY_ID }}"
            [APPLE_MUSIC_PRIVATE_KEY]="${{ secrets.APPLE_MUSIC_PRIVATE_KEY }}"
            [ADMIN_ENCRYPTION_KEY]="${{ secrets.ADMIN_ENCRYPTION_KEY }}"
          )
          FAILED=0
          for KEY in "${!SECRETS[@]}"; do
            VAL="${SECRETS[$KEY]}"
            if [ -n "$VAL" ]; then
              if printf '%s' "$VAL" | npx wrangler secret put "$KEY" --name "$WORKER"; then
                echo "✓ $KEY"
              else
                echo "✗ $KEY failed"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi

