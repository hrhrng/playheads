name: Deploy Preview

on:
  push:
    branches-ignore: [main]

jobs:
  deploy:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Derive branch slug
        id: branch
        run: |
          SLUG=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-$//')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SPOTIFY_REDIRECT_URI: https://preview.app.${{ vars.PRODUCTION_DOMAIN }}/callback
        run: pnpm --filter web build

      - name: Build landing
        env:
          PUBLIC_APP_URL: https://preview.app.${{ vars.PRODUCTION_DOMAIN }}
        run: pnpm --filter landing build

      - name: Deploy landing worker
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SLUG="${{ steps.branch.outputs.slug }}"
          DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
          cp wrangler.preview.toml wrangler.branch.toml
          cat >> wrangler.branch.toml <<TOML

          [[routes]]
          pattern = "landing-${SLUG}.pw.${DOMAIN}"
          custom_domain = true
          TOML
          npx wrangler deploy --config wrangler.branch.toml \
            --name "playheads-landing-${SLUG}"

      - name: Deploy web worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SLUG="${{ steps.branch.outputs.slug }}"
          DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
          cp wrangler.preview.toml wrangler.branch.toml
          cat >> wrangler.branch.toml <<TOML

          [[routes]]
          pattern = "web-${SLUG}.pw.${DOMAIN}"
          custom_domain = true
          TOML
          npx wrangler deploy --config wrangler.branch.toml \
            --name "playheads-web-${SLUG}"

      - name: Deploy preview gateway
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
          cp wrangler.preview.toml wrangler.branch.toml
          cat >> wrangler.branch.toml <<TOML

          [[routes]]
          pattern = "preview.${DOMAIN}"
          custom_domain = true

          [[routes]]
          pattern = "preview.app.${DOMAIN}"
          custom_domain = true
          TOML
          npx wrangler deploy --config wrangler.branch.toml \
            --name "playheads-gateway-preview" \
            --var APP_HOSTNAME:preview.app.${DOMAIN} \
            --var PREVIEW_DOMAIN:pw.${DOMAIN}

      - name: Deploy backend worker
        working-directory: apps/backend-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SLUG="${{ steps.branch.outputs.slug }}"
          DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
          cp wrangler.toml wrangler.branch.toml
          sed -i "s/^name = .*/name = \"playheads-backend-${SLUG}\"/" wrangler.branch.toml
          cat >> wrangler.branch.toml <<TOML

          [[routes]]
          pattern = "backend-${SLUG}.pw.${DOMAIN}"
          custom_domain = true
          TOML
          npx wrangler deploy --config wrangler.branch.toml

      - name: Deploy admin worker
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name "playheads-admin-${{ steps.branch.outputs.slug }}"

      - name: Sync admin secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER="playheads-admin-${{ steps.branch.outputs.slug }}"
          declare -A SECRETS=(
            [SUPABASE_URL]="${{ secrets.SUPABASE_URL }}"
            [SUPABASE_SERVICE_ROLE_KEY]="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            [SUPABASE_ANON_KEY]="${{ vars.VITE_SUPABASE_ANON_KEY }}"
            [ADMIN_EMAILS]="${{ secrets.ADMIN_EMAILS }}"
          )
          for KEY in "${!SECRETS[@]}"; do
            VAL="${SECRETS[$KEY]}"
            if [ -n "$VAL" ]; then
              echo "$VAL" | npx wrangler secret put "$KEY" --name "$WORKER" 2>/dev/null
              echo "✓ $KEY"
            fi
          done

      - name: Sync landing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER="playheads-landing-${{ steps.branch.outputs.slug }}"
          declare -A SECRETS=(
            [SUPABASE_URL]="${{ secrets.SUPABASE_URL }}"
            [SUPABASE_SERVICE_ROLE_KEY]="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            [ADMIN_EMAILS]="${{ secrets.ADMIN_EMAILS }}"
            [CRON_SECRET]="${{ secrets.CRON_SECRET }}"
          )
          for KEY in "${!SECRETS[@]}"; do
            VAL="${SECRETS[$KEY]}"
            if [ -n "$VAL" ]; then
              echo "$VAL" | npx wrangler secret put "$KEY" --name "$WORKER" 2>/dev/null
              echo "✓ $KEY"
            fi
          done

      - name: Sync secrets to backend worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          WORKER="playheads-backend-${{ steps.branch.outputs.slug }}"
          SKIP_KEYS='["GITHUB_TOKEN","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID"]'
          for KEY in $(echo "$ALL_SECRETS" | jq -r --argjson skip "$SKIP_KEYS" 'keys[] | select(. as $k | $skip | index($k) | not)'); do
            VAL=$(echo "$ALL_SECRETS" | jq -r --arg k "$KEY" '.[$k]')
            if [ -z "$VAL" ]; then continue; fi
            echo "$VAL" | npx wrangler secret put "$KEY" --name "$WORKER" 2>/dev/null
            echo "✓ $KEY"
          done
