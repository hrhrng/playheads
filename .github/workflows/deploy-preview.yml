name: Deploy Preview

on:
  push:
    branches-ignore: [main]

jobs:
  deploy:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Derive branch slug
        id: branch
        run: |
          SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-$//')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_SPOTIFY_REDIRECT_URI: https://preview.app.${{ vars.PRODUCTION_DOMAIN }}/callback
        run: pnpm --filter web build

      - name: Build landing
        env:
          PUBLIC_APP_URL: https://preview.app.${{ vars.PRODUCTION_DOMAIN }}
        run: pnpm --filter landing build

      - name: Deploy landing worker
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SLUG="${{ steps.branch.outputs.slug }}"
          DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
          cp wrangler.preview.toml wrangler.branch.toml
          cat >> wrangler.branch.toml <<TOML

          [[routes]]
          pattern = "landing-${SLUG}.pw.${DOMAIN}"
          custom_domain = true
          TOML
          npx wrangler deploy --config wrangler.branch.toml \
            --name "playheads-landing-${SLUG}"

      - name: Deploy web worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SLUG="${{ steps.branch.outputs.slug }}"
          DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
          cp wrangler.preview.toml wrangler.branch.toml
          cat >> wrangler.branch.toml <<TOML

          [[routes]]
          pattern = "web-${SLUG}.pw.${DOMAIN}"
          custom_domain = true
          TOML
          npx wrangler deploy --config wrangler.branch.toml \
            --name "playheads-web-${SLUG}"

      - name: Deploy billing worker
        working-directory: apps/billing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SLUG="${{ steps.branch.outputs.slug }}"
          cp wrangler.preview.toml wrangler.branch.toml
          npx wrangler deploy --config wrangler.branch.toml \
            --name "playheads-billing-${SLUG}"

      - name: Deploy agent worker
        working-directory: apps/agent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SLUG="${{ steps.branch.outputs.slug }}"
          DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
          cp wrangler.preview.toml wrangler.branch.toml
          cat >> wrangler.branch.toml <<TOML

          [[routes]]
          pattern = "agent-${SLUG}.pw.${DOMAIN}"
          custom_domain = true
          TOML
          npx wrangler deploy --config wrangler.branch.toml \
            --name "playheads-agent-${SLUG}"

      - name: Deploy preview gateway
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SLUG="${{ steps.branch.outputs.slug }}"
          DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
          cp wrangler.preview.toml wrangler.branch.toml
          sed -i "s/playheads-agent-preview/playheads-agent-${SLUG}/" wrangler.branch.toml
          sed -i "s/playheads-web-preview/playheads-web-${SLUG}/" wrangler.branch.toml
          sed -i "s/playheads-billing-preview/playheads-billing-${SLUG}/" wrangler.branch.toml
          cat >> wrangler.branch.toml <<TOML

          [[routes]]
          pattern = "preview.${DOMAIN}"
          custom_domain = true

          [[routes]]
          pattern = "preview.app.${DOMAIN}"
          custom_domain = true

          [[routes]]
          pattern = "preview.admin.${DOMAIN}"
          custom_domain = true
          TOML
          npx wrangler deploy --config wrangler.branch.toml \
            --name "playheads-gateway-preview" \
            --var APP_HOSTNAME:preview.app.${DOMAIN} \
            --var ADMIN_HOSTNAME:preview.admin.${DOMAIN} \
            --var PREVIEW_DOMAIN:pw.${DOMAIN}

      - name: Deploy admin worker
        working-directory: apps/admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SLUG="${{ steps.branch.outputs.slug }}"
          DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
          cp wrangler.toml wrangler.branch.toml
          cat >> wrangler.branch.toml <<TOML

          [[routes]]
          pattern = "admin-${SLUG}.pw.${DOMAIN}"
          custom_domain = true
          TOML
          npx wrangler deploy --config wrangler.branch.toml \
            --name "playheads-admin-${SLUG}"

      - name: Sync admin secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER="playheads-admin-${{ steps.branch.outputs.slug }}"
          if [ -n "${{ secrets.RESEND_API_KEY }}" ]; then
            printf '%s' "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY --name "$WORKER" && echo "✓ RESEND_API_KEY" || echo "✗ RESEND_API_KEY failed"
          fi
          if [ -n "${{ secrets.ADMIN_ENCRYPTION_KEY }}" ]; then
            printf '%s' "${{ secrets.ADMIN_ENCRYPTION_KEY }}" | npx wrangler secret put ADMIN_ENCRYPTION_KEY --name "$WORKER" && echo "✓ ADMIN_ENCRYPTION_KEY" || echo "✗ ADMIN_ENCRYPTION_KEY failed"
          fi
          if [ -n "${{ secrets.CF_AIG_TOKEN }}" ]; then
            printf '%s' "${{ secrets.CF_AIG_TOKEN }}" | npx wrangler secret put CF_AIG_TOKEN --name "$WORKER" && echo "✓ CF_AIG_TOKEN" || echo "✗ CF_AIG_TOKEN failed"
          fi
          # ASR smoke-test page — env fallbacks for the BYOK key fields.
          # All optional; missing keys disable the corresponding provider
          # unless the operator pastes one in the UI.
          if [ -n "${{ secrets.FISH_AUDIO_API_KEY }}" ]; then
            printf '%s' "${{ secrets.FISH_AUDIO_API_KEY }}" | npx wrangler secret put FISH_AUDIO_API_KEY --name "$WORKER" && echo "✓ FISH_AUDIO_API_KEY" || echo "✗ FISH_AUDIO_API_KEY failed"
          fi
          if [ -n "${{ secrets.ELEVENLABS_API_KEY }}" ]; then
            printf '%s' "${{ secrets.ELEVENLABS_API_KEY }}" | npx wrangler secret put ELEVENLABS_API_KEY --name "$WORKER" && echo "✓ ELEVENLABS_API_KEY" || echo "✗ ELEVENLABS_API_KEY failed"
          fi
          if [ -n "${{ secrets.XAI_API_KEY }}" ]; then
            printf '%s' "${{ secrets.XAI_API_KEY }}" | npx wrangler secret put XAI_API_KEY --name "$WORKER" && echo "✓ XAI_API_KEY" || echo "✗ XAI_API_KEY failed"
          fi
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            printf '%s' "${{ secrets.GROQ_API_KEY }}" | npx wrangler secret put GROQ_API_KEY --name "$WORKER" && echo "✓ GROQ_API_KEY" || echo "✗ GROQ_API_KEY failed"
          fi

      - name: Sync gateway secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER="playheads-gateway-preview"
          DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
          declare -A SECRETS=(
            [BETTER_AUTH_SECRET]="${{ secrets.BETTER_AUTH_SECRET }}"
            [BETTER_AUTH_URL]="https://preview.${DOMAIN}"
            [BETTER_AUTH_TRUSTED_ORIGINS]="https://preview.${DOMAIN},https://preview.app.${DOMAIN},http://localhost:5173"
            [APPLE_CLIENT_ID]="${{ secrets.APPLE_CLIENT_ID }}"
            [APPLE_KEY_ID]="${{ secrets.APPLE_KEY_ID }}"
            [APPLE_TEAM_ID]="${{ secrets.APPLE_TEAM_ID }}"
            [APPLE_PRIVATE_KEY]="${{ secrets.APPLE_PRIVATE_KEY }}"
            [APPLE_APP_BUNDLE_IDENTIFIER]="${{ secrets.APPLE_APP_BUNDLE_IDENTIFIER }}"
            [GOOGLE_CLIENT_ID]="${{ secrets.GOOGLE_CLIENT_ID }}"
            [GOOGLE_CLIENT_SECRET]="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            [RESEND_API_KEY]="${{ secrets.RESEND_API_KEY }}"
            [CF_AIG_TOKEN]="${{ secrets.CF_AIG_TOKEN }}"
            [FISH_AUDIO_API_KEY]="${{ secrets.FISH_AUDIO_API_KEY }}"
            [ELEVENLABS_API_KEY]="${{ secrets.ELEVENLABS_API_KEY }}"
          )
          FAILED=0
          for KEY in "${!SECRETS[@]}"; do
            VAL="${SECRETS[$KEY]}"
            if [ -n "$VAL" ]; then
              if printf '%s' "$VAL" | npx wrangler secret put "$KEY" --name "$WORKER"; then
                echo "✓ $KEY"
              else
                echo "✗ $KEY failed"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi

      - name: Sync agent worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER="playheads-agent-${{ steps.branch.outputs.slug }}"
          # CLOUDFLARE_ACCOUNT_ID and AI_GATEWAY_ID are already defined as
          # [vars] in wrangler.toml — do NOT set them as secrets (name conflict).
          declare -A SECRETS=(
            [CF_AIG_TOKEN]="${{ secrets.CF_AIG_TOKEN }}"
            [ADMIN_ENCRYPTION_KEY]="${{ secrets.ADMIN_ENCRYPTION_KEY }}"
            [APPLE_MUSIC_TEAM_ID]="${{ secrets.APPLE_MUSIC_TEAM_ID }}"
            [APPLE_MUSIC_KEY_ID]="${{ secrets.APPLE_MUSIC_KEY_ID }}"
            [APPLE_MUSIC_PRIVATE_KEY]="${{ secrets.APPLE_MUSIC_PRIVATE_KEY }}"
            [ADMIN_ENCRYPTION_KEY]="${{ secrets.ADMIN_ENCRYPTION_KEY }}"
          )
          FAILED=0
          for KEY in "${!SECRETS[@]}"; do
            VAL="${SECRETS[$KEY]}"
            if [ -n "$VAL" ]; then
              if printf '%s' "$VAL" | npx wrangler secret put "$KEY" --name "$WORKER"; then
                echo "✓ $KEY"
              else
                echo "✗ $KEY failed"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi

      - name: Sync billing worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER="playheads-billing-${{ steps.branch.outputs.slug }}"
          declare -A SECRETS=(
            [POLAR_API_KEY]="${{ secrets.POLAR_API_KEY }}"
            [POLAR_WEBHOOK_SECRET]="${{ secrets.POLAR_WEBHOOK_SECRET }}"
          )
          for KEY in "${!SECRETS[@]}"; do
            VAL="${SECRETS[$KEY]}"
            if [ -n "$VAL" ]; then
              printf '%s' "$VAL" | npx wrangler secret put "$KEY" --name "$WORKER" && echo "✓ $KEY" || echo "✗ $KEY failed"
            else
              echo "○ $KEY not set in GitHub yet — billing routes will 500 until configured"
            fi
          done

